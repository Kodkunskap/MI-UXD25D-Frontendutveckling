<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Träningsdagboken</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main>

        <h1>Träningsdagboken</h1>


        <!---
        
        |-------------|------------------------|-----------|---------|---------|
        | Datum.      | Aktivitet              | Tid       | Puls    | Kal     |
        |-------------|------------------------|-----------|---------|---------|
        | 10 Aug.     | Löpning                | 45:10.    | 145.    | 512.    |
        | 15 Aug.     | Boxing                 | 35:00.    | 156.    | 612.    |
        |-------------|------------------------|-----------|---------|---------|
        | Sammanfattning över perioden         | 80:10.    | 150.    | 1124.   |
        |-------------|------------------------|-----------|---------|---------|
                         Träningsakriviteter under vald period

        -->


        <table>
            <caption>Träningsaktiviteter under vald period</caption>
            <thead>
                <tr>
                    <th id="table-date">Datum</th>
                    <th id="table-activity">Aktivitet</th>
                    <th id="table-time">Tid</th>
                    <th id="table-puls">Puls</th>
                    <th id="table-kcal">Kal</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>10 Aug</td>
                    <td>Löpning</td>
                    <td class="center-text">45:10</td>
                    <td class="center-text">145</td>
                    <td class="center-text">512</td>
                </tr>
                <tr>
                    <td>15 Aug</td>
                    <td>Boxing</td>
                    <td class="center-text">35:00</td>
                    <td class="center-text">156</td>
                    <td class="center-text">612</td>
                </tr>
                <tr>
                    <td>16 Aug</td>
                    <td>Grouptraining - Kettlebells</td>
                    <td class="center-text">55:00</td>
                    <td class="center-text">130</td>
                    <td class="center-text">760</td>
                </tr>
                <tr>
                    <td>18 Aug</td>
                    <td>Strength</td>
                    <td class="center-text">68:00</td>
                    <td class="center-text">120</td>
                    <td class="center-text">700</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="2">Sammanfattning över perioden</td>
                    <td class="center-text">203:10</td>
                    <td class="center-text">138</td>
                    <td class="center-text">2584</td>
                </tr>
            </tfoot>

        </table>


    </main>

</body>
</html>
